<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Saya</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef4ff, #f8fbff);
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .container {
      width: min(900px, 100%);
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      padding: 28px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 2.5rem);
      color: #111827;
    }
    p {
      margin: 0 0 24px;
      color: #4b5563;
      font-size: 1rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }
    .card {
      display: block;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px 20px;
      text-decoration: none;
      color: #111827;
      font-weight: 700;
      transition: 0.2s ease;
    }
    .card:hover {
      background: #edf5ff;
      border-color: #bfd3ff;
      transform: translateY(-2px);
    }
    .badge {
      display: inline-block;
      margin-bottom: 8px;
      padding: 6px 10px;
      background: #dbeafe;
      color: #1d4ed8;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Project Saya</h1>
    <p>Daftar project yang sudah tergabung dalam repo ini.</p>

    <div class="grid">
      <a class="card" href="./gabungtxt/">
        <span class="badge">Folder</span><br />
        gabungtxt
      </a>
      <a class="card" href="./tombolkd/">
        <span class="badge">Folder</span><br />
        tombolkd
      </a>
      <a class="card" href="./tombol2/">
        <span class="badge">Folder</span><br />
        tombol2
      </a>
      <a class="card" href="./ABSENSIDUKOPS/">
        <span class="badge">Folder</span><br />
        ABSENSIDUKOPS
      </a>
    </div>
  </div>
</body>
</html>
